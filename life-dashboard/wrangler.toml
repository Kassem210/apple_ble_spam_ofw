name = "life-dashboard"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Keep anything you add in the Cloudflare dashboard when the app redeploys.
keep_vars = true

# Static app (HTML/CSS/JS/service worker) served for free by Workers Assets.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Free SQLite database. No id needed: Cloudflare creates it on the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "life-dashboard"

# Every 5 minutes: morning briefing, task reminders, evening check-in, health sync.
[triggers]
crons = ["*/5 * * * *"]

[vars]
TIMEZONE = "Africa/Cairo"

[observability]
enabled = true
