name = "life-dashboard"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static app (HTML/CSS/JS/service worker) served for free by Workers Assets.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Free SQLite database. `npm run setup` fills in database_id for you.
[[d1_databases]]
binding = "DB"
database_name = "life-dashboard"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Every 5 minutes: morning briefing, task reminders, evening check-in, health sync.
[triggers]
crons = ["*/5 * * * *"]

[vars]
TIMEZONE = "Africa/Cairo"

[observability]
enabled = true
